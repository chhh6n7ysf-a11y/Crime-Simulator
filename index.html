<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>犯罪模拟器 Crime Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#eef3f8;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
#game{position:relative;width:100vw;height:100dvh;background:#18232d}
canvas{width:100%;height:100%;display:block}
.panel{background:#101820eF;border:1px solid #536474;border-radius:12px;padding:10px;box-shadow:0 5px 20px #0008}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#hud>div{pointer-events:auto}
.small{font-size:12px;color:#bdc9d5}.big{font-weight:800;font-size:16px}
#objective{position:absolute;top:82px;left:8px;max-width:230px;font-size:12px}
#message{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#111d;color:white;padding:12px 18px;border-radius:12px;display:none;text-align:center;max-width:85%;border:1px solid #8194a5}
#controls{position:absolute;bottom:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:124px;height:124px;border-radius:50%;background:#dce8f022;border:2px solid #dce8f066;position:relative;pointer-events:auto}
#nub{width:48px;height:48px;border-radius:50%;background:#dce8f099;position:absolute;left:36px;top:36px}
.actions{display:grid;grid-template-columns:repeat(2,64px);gap:8px;pointer-events:auto}
button{border:1px solid #8da0b3;background:#243443;color:#fff;border-radius:10px;padding:10px 8px;font-weight:700}
button:active{background:#47637b}button:disabled{opacity:.35}
#menu{position:absolute;inset:0;background:#071018dd;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
#menu .inner{width:min(520px,100%);max-height:95%;overflow:auto}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row button{flex:1;min-width:100px}
#inventory{position:absolute;right:8px;top:82px;width:164px;font-size:12px}
.slot{border:1px solid #596b7b;border-radius:7px;padding:6px;margin:4px 0;background:#24313d}
#prompt{position:absolute;bottom:154px;left:50%;transform:translateX(-50%);font-size:13px;background:#101820dd;padding:8px 12px;border-radius:9px;white-space:nowrap}
.hidden{display:none!important}
@media(min-width:800px){#controls{max-width:700px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>
<div id="game">
<canvas id="view"></canvas>
<div id="hud">
 <div class="panel"><div class="big" id="place">家</div><div class="small" id="clock">第1天 20:00</div></div>
 <div class="panel" style="text-align:right"><div class="big" id="money">$0</div><div class="small" id="quota">今日配额 $300</div></div>
</div>
<div id="objective" class="panel">目标：准备出发。进入卡车查看地图。</div>
<div id="inventory" class="panel"><b>物品栏</b><div id="slots"></div></div>
<div id="prompt" class="hidden">靠近物品按互动</div>
<div id="message"></div>
<div id="controls">
 <div id="stick"><div id="nub"></div></div>
 <div class="actions">
  <button id="interact">互动</button><button id="run">跑步</button>
  <button id="hit">木棍</button><button id="bag">背包</button>
 </div>
</div>
<div id="menu"><div class="inner panel">
<h1>犯罪模拟器</h1><div class="small">CRIME SIMULATOR · 早期试玩版</div>
<p>你是一个负债累累的普通人。白天整理装备，夜晚潜入住宅，把赃物运回卡车，努力完成每日配额。</p>
<div class="row"><button id="start">开始游戏</button><button id="help">操作说明</button></div>
<div id="helptext" class="small hidden">手机：左侧摇杆移动，右侧按钮互动/跑步/木棍。电脑：WASD移动、鼠标转向、E互动、Shift跑步、空格挥棍。靠近卡车可打开地图或存放赃物。撬锁会在门周围约5米范围内发出声音；玻璃切割器无声。此为虚构游戏机制。</div>
<div class="small">提示：靠近门、窗户、物品或卡车时，屏幕下方会出现互动提示。</div>
</div></div>
</div>
<script>
(()=>{
const c=document.getElementById('view'),ctx=c.getContext('2d');
let W=0,H=0,scene='home',day=1,minutes=20*60,money=0,quota=300,townHours=0,cityPass=false,desertPass=false,desertUsed=false;
let running=false,started=false,menuMode='',messageTimer=0,alert=0,turn=0,actionMinutes=0;
const player={x:3.5,y:5.5,a:0,hp:100};
let inv={tools:['撬锁器','玻璃切割器','木棍'],loot:[]},stash=[],items=[],npcs=[],walls=[],doors=[],glass=[],truck={x:5.5,y:3.5};
let keys={},joy={x:0,y:0},mouseDown=false,last=0,gameSeconds=0,quotaDone=false;
const maps={
 home:["1111111111","1000000001","1000000001","1000000001","1000000001","1000000001","1000000001","1000000001","1000000001","1111111111"],
 town:["1111111111111111","1000000000000001","1000111000110001","1000100000010001","1000100000010001","1000000000000001","1001100011001101","1001000010000101","1001000010000101","1000000000000001","1000110000110001","1000100000010001","1000100000010001","1000000000000001","1000000000000001","1111111111111111"],
 city:["1111111111111111","1000000000000001","1000110000110001","1000100000010001","1000100000010001","1000000000000001","1000000000000001","1000110000110001","1000100000010001","1000100000010001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1111111111111111"],
 desert:["1111111111111111","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1000000000000001","1111111111111111"]
};
let grid=[];
function loadScene(s){
 scene=s;grid=maps[s].map(r=>r.split('').map(Number));doors=[];glass=[];items=[];npcs=[];
 if(s==='home'){player.x=3.5;player.y=5.5;player.a=-Math.PI/2;truck={x:5.5,y:3.5};items=[{x:7.5,y:5.5,name:'旧电视',value:40,taken:false}];}
 if(s==='town'){
 truck={x:14.2,y:14.2};player.x=1.8;player.y=1.8;player.a=.1;
 // houses and yards represented by rooms/entry points
 doors=[{x:4.5,y:3.5,open:false,locked:true,name:'普通住宅'},{x:11.5,y:3.5,open:false,locked:true,name:'二层住宅'},{x:4.5,y:11.5,open:false,locked:true,name:'围栏住宅'},{x:11.5,y:11.5,open:false,locked:true,name:'富人住宅'}];
 glass=[{x:5.5,y:3.5,cut:false},{x:12.5,y:3.5,cut:false},{x:5.5,y:11.5,cut:false},{x:12.5,y:11.5,cut:false}];
 items=[{x:3.5,y:3.5,name:'旧相机',value:85,taken:false},{x:10.5,y:3.5,name:'游戏主机',value:160,taken:false},{x:3.5,y:10.5,name:'金项链',value:240,taken:false},{x:10.5,y:10.5,name:'名表',value:380,taken:false},{x:14.5,y:8.5,name:'现金信封',value:120,taken:false}];
 for(let i=0;i<7;i++)npcs.push({x:2.5+(i%4)*3.2,y:6.5+Math.floor(i/4)*4,a:Math.random()*6.28,sleep:false,down:0,guard:i===6});
 }
 if(s==='city'){truck={x:14.2,y:14.2};player.x=2;player.y=2;player.a=0;doors=[{x:7.5,y:7.5,open:false,locked:true,name:'警察局局长办公室'}];items=[{x:8.5,y:7.5,name:'沙漠通行证',value:0,taken:false,key:true},{x:12.5,y:11.5,name:'名贵雕塑',value:500,taken:false}];for(let i=0;i<5;i++)npcs.push({x:4+i*2,y:5,a:0,sleep:false,down:0,guard:i===0});}
 if(s==='desert'){truck={x:14.2,y:14.2};player.x=2;player.y=2;player.a=0;items=[{x:8.5,y:8.5,name:'古董箱',value:650,taken:false},{x:12.5,y:4.5,name:'宝石袋',value:450,taken:false}];}
 updateUI();
}
function say(t){let el=document.getElementById('message');el.textContent=t;el.style.display='block';messageTimer=2.5;}
function updateUI(){
 document.getElementById('place').textContent=({home:'家与卡车',town:'城镇',city:'市中心',desert:'沙漠'})[scene];
 let hh=Math.floor(minutes/60)%24,mm=minutes%60;
 document.getElementById('clock').textContent=`第${day}天 ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
 document.getElementById('money').textContent='$'+money;
 document.getElementById('quota').textContent=`今日配额 $${quota}`;
 document.getElementById('slots').innerHTML=`<div class="slot">工具1：撬锁器</div><div class="slot">工具2：玻璃切割器</div><div class="slot">工具3：木棍</div><div class="slot">赃物格4：${inv.loot[0]||'空'}</div><div class="slot">赃物格5：${inv.loot[1]||'空'}</div><div class="slot">赃物格6：${inv.loot[2]||'空'}</div>`;
 document.getElementById('objective').textContent=money>=quota?'配额已完成！继续搜刮或返回卡车。':`目标：筹集 $${quota}（还差 $${Math.max(0,quota-money)}）。卡车内可查看地图并存放赃物。`;
}
function wallAt(x,y){let ix=Math.floor(x),iy=Math.floor(y);return !grid[iy]||grid[iy][ix]!==0;}
function near(a,b,d=1){return Math.hypot(a.x-b.x,a.y-b.y)<d;}
function nearest(){
 let p={x:player.x,y:player.y},best=null,dist=1.25;
 const check=(obj,type)=>{let d=Math.hypot(p.x-obj.x,p.y-obj.y);if(d<dist){dist=d;best={obj,type};}};
 check(truck,'truck');
 items.forEach(o=>{if(!o.taken)check(o,'item')});
 doors.forEach(o=>check(o,'door'));
 glass.forEach(o=>check(o,'glass'));
 return best;
}
function interact(){
 let n=nearest();if(!n){say('附近没有可互动的目标。');return}
 let o=n.obj;
 if(n.type==='truck'){
  if(scene==='home'){openMap();return}
  say('赃物已运回卡车。');stash.push(...inv.loot);inv.loot=[];running=false;loadScene('home');return;
 }
 if(n.type==='item'){
  if(o.key){desertPass=true;o.taken=true;say('获得沙漠一次性通行证！');}
  else if(inv.loot.length>=3)say('赃物格已满！先回卡车存放。');
  else{inv.loot.push(o.name);o.taken=true;say(`获得：${o.name}（估值 $${o.value}）。回卡车后出售。`);o._v=o.value;}
  updateUI();return;
 }
 if(n.type==='door'){
  if(o.locked){alert=2.2;say('撬锁器发出声响！附近居民可能听见。');o.locked=false;o.open=true;}
  else{o.open=!o.open;}
  return;
 }
 if(n.type==='glass'){o.cut=true;say('玻璃已被切开，没有发出声音。');return}
}
function openMap(){
 menuMode='map';let m=document.getElementById('menu');m.style.display='flex';
 let cityAllowed=townHours>=10;
 m.querySelector('.inner').innerHTML=`<h1>卡车地图</h1><p class="small">选择目的地。卡车是你的移动仓库，返回卡车即可存放赃物。</p>
 <div class="row"><button data-go="town">城镇（开放）</button><button data-go="city" ${cityAllowed?'':'disabled'}>市中心（${cityAllowed?'可进入':'城镇行动累计10小时解锁'}）</button></div>
 <div class="row"><button data-go="desert" ${desertPass&&!desertUsed?'':'disabled'}>沙漠（一次性通行证）</button><button id="sell">出售卡车赃物</button></div>
 <p class="small">卡车库存：${stash.join('、')||'空'}<br>当前背包：${inv.loot.join('、')||'空'}</p><button id="closemap">离开地图</button>`;
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let s=b.dataset.go;if(s==='desert'){desertUsed=true;desertPass=false;}if(s==='city'&&townHours<10)return; m.style.display='none';loadScene(s);minutes=21*60;actionMinutes=0;running=true;say('行动开始：必须在早上09:00前返回卡车！');});
 document.getElementById('sell').onclick=()=>{let total=0;stash.forEach(name=>{let it=findValue(name);total+=it});money+=total;stash=[];say(`赃物已出售，获得 $${total}。`);updateUI();openMap();};
 document.getElementById('closemap').onclick=()=>{m.style.display='none'};
}
function findValue(name){let vals={'旧相机':85,'游戏主机':160,'金项链':240,'名表':380,'现金信封':120,'名贵雕塑':500,'古董箱':650,'宝石袋':450,'旧电视':40};return vals[name]||100}
function hit(){
 let target=npcs.find(n=>Math.hypot(player.x-n.x,player.y-n.y)<1.5&&!n.down);
 if(target){target.down=180;say('NPC被木棍击倒，约3分钟后恢复。');}else say('附近没有可击倒的NPC。');
}
function update(dt){
 if(!started)return;
 if(messageTimer>0){messageTimer-=dt;if(messageTimer<=0)document.getElementById('message').style.display='none'}
 if(running&&scene!=='home'){
  minutes+=dt*8;actionMinutes+=dt*8;gameSeconds+=dt;
  if(scene==='town')townHours+=dt*8/60;
  if(actionMinutes>=720){minutes=9*60;running=false;loadScene('home');say('行动时间结束！你被强制传送回家，卡车上的物品已安全带回。');}
  if(minutes>=24*60)minutes-=24*60;
  if(gameSeconds>0&&Math.floor(gameSeconds)%90===0){npcs.forEach(n=>{if(!n.guard)n.sleep=Math.random()<.35;});}
 }
 let speed=(keys.ShiftLeft||keys.ShiftRight||running?2.7:1.7)*dt;
 let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)+joy.y*-1;
 let str=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x;
 let nx=player.x+Math.cos(player.a)*f*speed+Math.cos(player.a+Math.PI/2)*str*speed;
 let ny=player.y+Math.sin(player.a)*f*speed+Math.sin(player.a+Math.PI/2)*str*speed;
 if(!wallAt(nx,player.y))player.x=nx;if(!wallAt(player.x,ny))player.y=ny;
 if(keys.ArrowLeft)player.a-=dt*2;if(keys.ArrowRight)player.a+=dt*2;
 npcs.forEach(n=>{if(n.down>0)n.down-=dt;if(!n.sleep&&!n.down){n.a+=Math.sin(gameSeconds+n.x)*dt*.4;n.x+=Math.cos(n.a)*dt*.12;n.y+=Math.sin(n.a)*dt*.12;if(Math.hypot(player.x-n.x,player.y-n.y)<1.3&&alert>0)say('有人听见动静，快躲起来！');}});
 if(alert>0)alert-=dt;
 updateUI();
}
function render(){
 W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;
 ctx.fillStyle='#111b28';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#27313b';ctx.fillRect(0,H/2,W,H/2);
 let fov=Math.PI/3,cols=Math.ceil(W/3);
 for(let i=0;i<cols;i++){
  let angle=player.a-fov/2+(i/cols)*fov,dist=0,hit=false;
  while(dist<18&&!hit){dist+=.025;hit=wallAt(player.x+Math.cos(angle)*dist,player.y+Math.sin(angle)*dist)}
  let corrected=dist*Math.cos(angle-player.a),height=Math.min(H,H/(corrected+.12));
  let shade=Math.max(25,180-corrected*13);
  ctx.fillStyle=`rgb(${shade*.68},${shade*.78},${shade})`;ctx.fillRect(i*3,(H-height)/2,4,height);
 }
 // sprites: objects and NPCs
 let sprites=[];
 items.filter(o=>!o.taken).forEach(o=>sprites.push({...o,kind:'item'}));
 npcs.filter(n=>!n.sleep||n.down>0).forEach(o=>sprites.push({...o,kind:'npc'}));
 sprites.push({...truck,kind:'truck'});
 sprites.sort((a,b)=>Math.hypot(b.x-player.x,b.y-player.y)-Math.hypot(a.x-player.x,a.y-player.y));
 sprites.forEach(o=>{
  let dx=o.x-player.x,dy=o.y-player.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-player.a;
  while(a>Math.PI)a-=Math.PI*2;while(a< -Math.PI)a+=Math.PI*2;
  if(Math.abs(a)>fov*.65||d<.2)return;
  let sx=(.5+a/fov)*W,sz=Math.min(H*.7,H/(d+.2)*.55),sy=H/2;
  ctx.fillStyle=o.kind==='npc'?(o.down>0?'#9c9c9c':o.guard?'#e0b34c':'#b5c6d4'):o.kind==='truck'?'#b64d38':o.kind==='item'?'#e3d37a':'#fff';
  if(o.kind==='npc'){ctx.fillRect(sx-sz*.13,sy-sz*.25,sz*.26,sz*.55);ctx.beginPath();ctx.arc(sx,sy-sz*.34,sz*.13,0,Math.PI*2);ctx.fill();}
  else if(o.kind==='truck'){ctx.fillRect(sx-sz*.45,sy-sz*.35,sz*.9,sz*.55);}
  else{ctx.fillRect(sx-sz*.18,sy-sz*.12,sz*.36,sz*.24);}
 });
 let n=nearest();let p=document.getElementById('prompt');p.classList.toggle('hidden',!n);
 if(n)p.textContent=({truck:'互动：打开卡车地图 / 存放赃物',item:'互动：拾取 '+n.obj.name,door:'互动：撬锁 / 开关门',glass:'互动：切割玻璃'})[n.type];
}
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}
document.getElementById('start').onclick=()=>{document.getElementById('menu').style.display='none';started=true;loadScene('home');say('你醒来了。走到大卡车旁，互动打开地图。');};
document.getElementById('help').onclick=()=>document.getElementById('helptext').classList.toggle('hidden');
document.getElementById('interact').onclick=interact;document.getElementById('hit').onclick=hit;
document.getElementById('run').onpointerdown=()=>{keys.ShiftLeft=true};document.getElementById('run').onpointerup=()=>{keys.ShiftLeft=false};
document.getElementById('bag').onclick=()=>say(`背包：${inv.loot.join('、')||'空'}；卡车库存：${stash.join('、')||'空'}`);
onkeydown=e=>{keys[e.code]=true;if(e.code==='KeyE')interact();if(e.code==='Space')hit();};
onkeyup=e=>keys[e.code]=false;
let stick=document.getElementById('stick'),nub=document.getElementById('nub');
stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);moveJoy(e)};
stick.onpointermove=e=>{if(e.buttons)moveJoy(e)};
stick.onpointerup=()=>{joy={x:0,y:0};nub.style.left='36px';nub.style.top='36px'};
function moveJoy(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),k=Math.min(1,48/(d||1));joy={x:x/48*k,y:y/48*k};nub.style.left=(36+x*k)+'px';nub.style.top=(36+y*k)+'px';}
c.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.35){mouseDown=true;c.setPointerCapture(e.pointerId)}});
c.addEventListener('pointermove',e=>{if(mouseDown){player.a+=(e.movementX||0)*.004}});
c.addEventListener('pointerup',()=>mouseDown=false);
loadScene('home');requestAnimationFrame(loop);
})();
</script>
</body></html>
